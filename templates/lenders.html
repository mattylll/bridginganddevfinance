{% extends "base.html" %}

{% block title %}Lenders - Developer Finance Engine{% endblock %}

{% block content %}
<div class="px-4 py-6 sm:px-0">
    <div class="flex justify-between items-center mb-6">
        <h1 class="text-3xl font-bold text-gray-900">Lenders</h1>
        <div class="flex gap-2">
            <select id="typeFilter" class="rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm p-2 border">
                <option value="">All Types</option>
                <option value="bridging_specialist">Bridging Specialist</option>
                <option value="development_funder">Development Funder</option>
                <option value="specialist_lender">Specialist Lender</option>
                <option value="bank">Bank</option>
                <option value="fund">Fund</option>
                <option value="peer_to_peer">P2P</option>
            </select>
        </div>
    </div>

    <div class="bg-white shadow overflow-hidden rounded-lg">
        <table class="min-w-full divide-y divide-gray-200">
            <thead class="bg-gray-50">
                <tr>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Lender</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Type</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Products</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Loan Range</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Last Updated</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
                </tr>
            </thead>
            <tbody id="lendersTable" class="bg-white divide-y divide-gray-200">
                <tr>
                    <td colspan="6" class="px-6 py-4 text-center text-gray-500">Loading...</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    async function loadLenders() {
        const typeFilter = document.getElementById('typeFilter').value;
        let url = '/api/v1/lenders/?limit=100';
        if (typeFilter) url += `&lender_type=${typeFilter}`;

        try {
            const response = await fetch(url);
            const data = await response.json();

            const tbody = document.getElementById('lendersTable');

            if (data.items.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="px-6 py-4 text-center text-gray-500">No lenders found</td></tr>';
                return;
            }

            let html = '';
            for (const lender of data.items) {
                html += `
                    <tr class="hover:bg-gray-50">
                        <td class="px-6 py-4 whitespace-nowrap">
                            <div class="flex items-center">
                                <div>
                                    <div class="text-sm font-medium text-gray-900">${lender.name}</div>
                                    <div class="text-sm text-gray-500">${lender.headquarters_location || '-'}</div>
                                </div>
                            </div>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap">
                            <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-indigo-100 text-indigo-800">
                                ${lender.lender_type.replace('_', ' ')}
                            </span>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                            ${lender.contacts ? lender.contacts.length : 0} products
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                            ${lender.min_loan_amount ? '£' + (lender.min_loan_amount/1000000).toFixed(1) + 'm' : '-'} -
                            ${lender.max_loan_amount ? '£' + (lender.max_loan_amount/1000000).toFixed(0) + 'm' : '-'}
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                            ${lender.last_scraped_at ? new Date(lender.last_scraped_at).toLocaleDateString() : 'Never'}
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
                            <a href="/api/v1/products/by-lender/${lender.id}" target="_blank" class="text-indigo-600 hover:text-indigo-900">View Products</a>
                        </td>
                    </tr>
                `;
            }

            tbody.innerHTML = html;

        } catch (error) {
            console.error('Error loading lenders:', error);
        }
    }

    document.getElementById('typeFilter').addEventListener('change', loadLenders);
    loadLenders();
</script>
{% endblock %}
