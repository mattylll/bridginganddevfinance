{% extends "base.html" %}

{% block title %}Search - Developer Finance Engine{% endblock %}

{% block content %}
<div class="px-4 py-6 sm:px-0">
    <h1 class="text-3xl font-bold text-gray-900 mb-6">Find Development Finance</h1>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <!-- Search Form -->
        <div class="lg:col-span-1">
            <div class="bg-white shadow rounded-lg p-6">
                <h2 class="text-lg font-medium text-gray-900 mb-4">Deal Details</h2>

                <form id="searchForm" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Finance Type</label>
                        <select id="financeType" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm p-2 border">
                            <option value="bridging">Bridging</option>
                            <option value="development">Development</option>
                            <option value="mezzanine">Mezzanine</option>
                            <option value="joint_venture">JV / Equity</option>
                            <option value="developer_exit">Developer Exit</option>
                            <option value="refurbishment">Refurbishment</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700">Loan Amount (£)</label>
                        <input type="number" id="loanAmount" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm p-2 border" placeholder="1,000,000" value="1000000">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700">Property Value (£)</label>
                        <input type="number" id="propertyValue" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm p-2 border" placeholder="1,500,000">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700">GDV (£) - for development</label>
                        <input type="number" id="gdv" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm p-2 border" placeholder="3,000,000">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700">Postcode</label>
                        <input type="text" id="postcode" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm p-2 border" placeholder="SW1A 1AA">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700">Term (months)</label>
                        <input type="number" id="termMonths" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm p-2 border" placeholder="12" value="12">
                    </div>

                    <div class="flex items-center">
                        <input type="checkbox" id="firstTime" class="h-4 w-4 rounded border-gray-300 text-indigo-600 focus:ring-indigo-500">
                        <label for="firstTime" class="ml-2 block text-sm text-gray-900">First-time developer</label>
                    </div>

                    <button type="submit" class="w-full inline-flex justify-center py-2 px-4 border border-transparent shadow-sm text-sm font-medium rounded-md text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                        Search
                    </button>
                </form>
            </div>
        </div>

        <!-- Results -->
        <div class="lg:col-span-2">
            <div class="bg-white shadow rounded-lg p-6">
                <h2 class="text-lg font-medium text-gray-900 mb-4">Matching Products</h2>

                <div id="resultsContainer">
                    <p class="text-gray-500">Enter your deal details and click Search to find matching products.</p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    document.getElementById('searchForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const searchData = {
            finance_type: document.getElementById('financeType').value,
            loan_amount: parseInt(document.getElementById('loanAmount').value) || 0,
            property_value: parseInt(document.getElementById('propertyValue').value) || null,
            gdv: parseInt(document.getElementById('gdv').value) || null,
            postcode: document.getElementById('postcode').value || null,
            term_months: parseInt(document.getElementById('termMonths').value) || null,
            is_first_time_developer: document.getElementById('firstTime').checked,
        };

        const container = document.getElementById('resultsContainer');
        container.innerHTML = '<p class="text-gray-500">Searching...</p>';

        try {
            const response = await fetch('/api/v1/search/loans', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(searchData),
            });

            const data = await response.json();

            if (data.total_matches === 0) {
                container.innerHTML = '<p class="text-yellow-600">No matching products found. Try adjusting your criteria.</p>';
                return;
            }

            let html = `
                <div class="mb-4 p-4 bg-indigo-50 rounded-lg">
                    <p class="text-sm text-indigo-700">
                        Found <strong>${data.total_matches}</strong> products from <strong>${data.lender_count}</strong> lenders
                        ${data.rate_range.min ? ` | Rates from <strong>${data.rate_range.min}%</strong> to <strong>${data.rate_range.max}%</strong>` : ''}
                    </p>
                </div>
                <div class="space-y-4">
            `;

            for (const match of data.matches) {
                const scoreColor = match.match_score.overall >= 70 ? 'green' : match.match_score.overall >= 50 ? 'yellow' : 'red';

                html += `
                    <div class="border rounded-lg p-4 ${match.matches_criteria ? 'border-gray-200' : 'border-yellow-300 bg-yellow-50'}">
                        <div class="flex justify-between items-start">
                            <div>
                                <h3 class="font-medium text-gray-900">${match.lender_name}</h3>
                                <p class="text-sm text-gray-500">${match.product_name}</p>
                            </div>
                            <div class="text-right">
                                <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-${scoreColor}-100 text-${scoreColor}-800">
                                    Score: ${match.match_score.overall.toFixed(0)}
                                </span>
                            </div>
                        </div>

                        <div class="mt-3 grid grid-cols-2 sm:grid-cols-4 gap-4 text-sm">
                            <div>
                                <span class="text-gray-500">Rate</span>
                                <p class="font-medium">${match.rate_from ? match.rate_from + '%' : '-'} ${match.rate_type || ''}</p>
                            </div>
                            <div>
                                <span class="text-gray-500">Max LTV</span>
                                <p class="font-medium">${match.max_ltv ? match.max_ltv + '%' : '-'}</p>
                            </div>
                            <div>
                                <span class="text-gray-500">Arrangement Fee</span>
                                <p class="font-medium">${match.arrangement_fee_percent ? match.arrangement_fee_percent + '%' : '-'}</p>
                            </div>
                            <div>
                                <span class="text-gray-500">Max Loan</span>
                                <p class="font-medium">${match.max_loan ? '£' + match.max_loan.toLocaleString() : '-'}</p>
                            </div>
                        </div>

                        ${match.criteria_issues.length > 0 ? `
                            <div class="mt-3 p-2 bg-yellow-100 rounded text-sm">
                                <span class="text-yellow-800 font-medium">Issues:</span>
                                <ul class="list-disc list-inside text-yellow-700">
                                    ${match.criteria_issues.map(i => `<li>${i}</li>`).join('')}
                                </ul>
                            </div>
                        ` : ''}
                    </div>
                `;
            }

            html += '</div>';
            container.innerHTML = html;

        } catch (error) {
            container.innerHTML = `<p class="text-red-600">Error searching: ${error.message}</p>`;
        }
    });
</script>
{% endblock %}
